name: 修仙主页自动更新

on:
  schedule:
    # 每天 08:00 / 12:00 / 15:00 / 17:00 / 22:00 北京时间各更新一次
    # （GitHub cron 使用 UTC：北京时间 -8 小时）
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 7 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'local/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 生成全部 SVG 卡片（GitHub 官方 API，零第三方依赖）
        run: node local/generate.js Mitchll1214
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images README.md
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: 自动更新修仙档案与灵宠数据"
            # 若远端有并发提交（如网页端编辑），rebase 后重试，避免更新中断
            if ! git push; then
              echo "首次推送失败，尝试 rebase 后重试..."
              git pull --rebase origin main
              git push
            fi
          fi
