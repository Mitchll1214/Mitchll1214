name: 修仙主页自动更新

on:
  schedule:
    # 每天 08:17 与 16:00 北京时间各更新一次
    - cron: '17 0 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'local/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成全部 SVG 卡片（GitHub 官方 API，零第三方依赖）
        run: node local/generate.js Mitchll1214
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images README.md
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: 自动更新修仙档案与灵宠数据"
            git push
          fi
