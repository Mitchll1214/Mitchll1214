      <text x="185" y="257" text-anchor="middle" font-size="16" fill="#F4E9D8" font-weight="700">67</text>
      <text x="185" y="272" text-anchor="middle" font-size="9" fill="#8E8CD8">洞府</text>
    </g><g>
