<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="480"
     height="300"
     viewBox="0 0 480 300"
     role="img"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">

<defs>

<!-- 外框渐变 -->
<linearGradient id="frame"
                x1="0"
                y1="0"
                x2="1"
                y2="1">
    <stop offset="0" stop-color="#D8B478"/>
    <stop offset="0.5" stop-color="#8E8CD8"/>
    <stop offset="1" stop-color="#D96C6C"/>
</linearGradient>


<!-- 灵力进度 -->
<linearGradient id="energy"
                x1="0"
                y1="0"
                x2="1"
                y2="0">
    <stop offset="0"
          stop-color="#D8B478"/>
    <stop offset="1"
          stop-color="#FFE6A7"/>
</linearGradient>


<!-- 头像裁剪 -->
<clipPath id="avatar"
          clipPathUnits="userSpaceOnUse">
    <circle cx="50"
            cy="86"
            r="24"/>
</clipPath>


</defs>


<!-- 主卡片 -->

<rect x="1"
      y="1"
      width="478"
      height="298"
      rx="20"
      fill="#0D1117"
      fill-opacity="0.97"
      stroke="url(#frame)"
      stroke-width="2"/>



