<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="480"
     height="300"
     viewBox="0 0 480 300"
     role="img"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">

<defs>

<!-- 外框渐变 -->
<linearGradient id="frame"
                x1="0"
                y1="0"
                x2="1"
                y2="1">
    <stop offset="0" stop-color="#D8B478"/>
    <stop offset="0.5" stop-color="#8E8CD8"/>
    <stop offset="1" stop-color="#D96C6C"/>
</linearGradient>


<!-- 灵力进度 -->
<linearGradient id="energy"
                x1="0"
                y1="0"
                x2="1"
                y2="0">
    <stop offset="0"
          stop-color="#D8B478"/>
    <stop offset="1"
          stop-color="#FFE6A7"/>
</linearGradient>


<!-- 头像裁剪 -->
<clipPath id="avatar"
          clipPathUnits="userSpaceOnUse">
    <circle cx="50"
            cy="86"
            r="24"/>
</clipPath>


</defs>


<!-- 主卡片 -->

<rect x="1"
      y="1"
      width="478"
      height="298"
      rx="20"
      fill="#0D1117"
      fill-opacity="0.97"
      stroke="url(#frame)"
      stroke-width="2"/>



<!-- 标题 -->

<text x="24"
      y="34"
      font-size="14"
      fill="#F4E9D8"
      font-weight="700"
      letter-spacing="1">
☯ 修仙档案 · 天道记录
</text>


<text x="456"
      y="34"
      text-anchor="end"
      font-size="10"
      fill="#8E8CD8">
更新于 08-13 17:51
</text>



<!-- 分割线 -->

<line x1="24"
      y1="48"
      x2="456"
      y2="48"
      stroke="#8E8CD8"
      stroke-opacity="0.25"/>



<!-- 头像（data URI 内嵌：<img> 模式渲染 SVG 时仅 data: 可用） -->

<image href="data:image/jpeg;base64," xlink:href="data:image/jpeg;base64," x="26" y="62" width="48" height="48" clip-path="url(#avatar)" preserveAspectRatio="xMidYMid slice"/>


<circle cx="50"
        cy="86"
        r="25"
        fill="none"
        stroke="#D8B478"
        stroke-width="2"/>



<!-- 用户信息 -->

<text x="86"
      y="82"
      font-size="20"
      fill="#F4E9D8"
      font-weight="700">
Mitchll
</text>


<text x="86"
      y="101"
      font-size="11"
      fill="#8E8CD8">
@Mitchll1214 · 入道 2020-03-06
</text>




<!-- 灵根 -->

<text x="24" y="132" font-size="11" fill="#8E8CD8">灵根</text><g>
        <rect x="72" y="116" width="124" height="22" rx="11" fill="#D8B478" fill-opacity="0.12" stroke="#D8B478" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="84" cy="127" r="3" fill="#D8B478"/>
        <text x="94" y="131" font-size="11" fill="#E8D7B5">JavaScript</text>
      </g><g>
        <rect x="204" y="116" width="80" height="22" rx="11" fill="#D8B478" fill-opacity="0.12" stroke="#D8B478" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="216" cy="127" r="3" fill="#D8B478"/>
        <text x="226" y="131" font-size="11" fill="#E8D7B5">Python</text>
