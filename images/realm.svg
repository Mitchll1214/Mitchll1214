        <rect x="292" y="116" width="58" height="22" rx="11" fill="#D8B478" fill-opacity="0.12" stroke="#D8B478" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="304" cy="127" r="3" fill="#D8B478"/>
        <text x="314" y="131" font-size="11" fill="#E8D7B5">Java</text>
      </g>




<!-- 境界 -->

<text x="24"
      y="176"
      font-size="36"
      fill="#E8B86D"
      font-weight="800">
化神·中期
</text>



<text x="26"
      y="198"
      font-size="11"
      fill="#9A93B8">
下一境：炼虚 · 预计 67 个月
</text>




<!-- 灵力条 -->

<rect x="24"
      y="212"
      width="432"
      height="10"
      rx="5"
