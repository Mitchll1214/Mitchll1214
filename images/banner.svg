<svg xmlns="http://www.w3.org/2000/svg" width="480" height="56" viewBox="0 0 480 56" role="img" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8E8CD8" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#3A3560" stop-opacity="0.9"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="478" height="54" rx="18" fill="rgba(13,17,23,0.96)" stroke="url(#frame)" stroke-width="2"/>
<text x="50%" y="50%" font-size="20" font-weight="600" fill="#8E8CD8" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
    看破红尘善与恶
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="18s" begin="0s" repeatCount="indefinite"/>
  </text><text x="50%" y="50%" font-size="20" font-weight="600" fill="#8E8CD8" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
    只观因果静思安
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="18s" begin="6s" repeatCount="indefinite"/>
  </text><text x="50%" y="50%" font-size="20" font-weight="600" fill="#8E8CD8" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
    因果不虚，静观其变
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="18s" begin="12s" repeatCount="indefinite"/>
  </text><g opacity="0.6">
    <circle cx="24" cy="28" r="2.5" fill="#8E8CD8"/>
    <circle cx="456" cy="28" r="2.5" fill="#8E8CD8"/>
  </g>
</svg>