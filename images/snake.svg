<svg xmlns="http://www.w3.org/2000/svg"
 width="480" height="160" viewBox="0 0 480 160"
 role="img"
 font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">

<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D8B478"/>
    <stop offset="0.45" stop-color="#8E8CD8"/>
    <stop offset="1" stop-color="#D96C6C"/>
  </linearGradient>

  <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8B478"/>
    <stop offset="0.5" stop-color="#F5DFA8"/>
    <stop offset="1" stop-color="#8E8CD8"/>
  </linearGradient>

  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8B478" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#F5DFA8" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#D8B478" stop-opacity="0"/>
  </linearGradient>

  <filter id="shadow">
    <feGaussianBlur stdDeviation="3"/>
  </filter>

  <path id="route"
        d="M45 95 C120 95 135 50 210 50 C290 50 300 115 370 115 C410 115 425 90 445 90"/>
</defs>

<!-- background -->
<rect x="1" y="1" width="478" height="158" rx="20"
 fill="#0D1117" fill-opacity="0.98"
 stroke="url(#frame)" stroke-width="2"/>

<!-- title -->
<text x="24" y="32"
 fill="#F4E9D8"
 font-size="14"
 font-weight="700"
 letter-spacing="1">
🐉 天道灵脉 · 提交轨迹
</text>

<text x="456" y="32"
 text-anchor="end"
 fill="#8E8CD8"
 font-size="10">
GITHUB CULTIVATION
</text>

<line x1="24" y1="45" x2="456" y2="45"
 stroke="#8E8CD8" stroke-opacity="0.25"/>


<!-- glow snake -->
<use href="#route"
 stroke="url(#glow)"
 stroke-width="12"
 fill="none"
 opacity="0.25"
 filter="url(#shadow)"/>

<!-- snake -->
<use href="#route"
 stroke="url(#snake)"
 stroke-width="5"
 fill="none"
 stroke-linecap="round"/>


<!-- nodes -->
<g fill="#F5DFA8">
 <circle cx="45" cy="95" r="5"/>
 <circle cx="210" cy="50" r="5"/>
 <circle cx="370" cy="115" r="5"/>
 <circle cx="445" cy="90" r="5"/>
</g>


<text x="24" y="145"
 fill="#9A93B8"
 font-size="11">
提交即修炼 · 代码即灵气 · 每一次贡献皆为境界提升
</text>

<text x="456" y="145"
 text-anchor="end"
 fill="#D8B478"
 font-size="11">
✦ 灵脉稳定运行
</text>

</svg>
