<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="800"
 height="250"
 viewBox="0 0 800 250"
 role="img"
 font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif">

<defs>

<!-- 背景径向渐变 -->
<radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
  <stop offset="0%" stop-color="#0A0E17"/>
  <stop offset="100%" stop-color="#111827"/>
</radialGradient>

<!-- 龙珠渐变 -->
<radialGradient id="ballGrad" cx="40%" cy="35%" r="75%">
  <stop offset="0%" stop-color="#fff7b0"/>
  <stop offset="55%" stop-color="#f5b81b"/>
  <stop offset="100%" stop-color="#b37b0e"/>
</radialGradient>

<!-- 进度条三色渐变 -->
<linearGradient id="pbarGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#00f0ff"/>
  <stop offset="55%" stop-color="#3a86ff"/>
  <stop offset="100%" stop-color="#ffd700"/>
</linearGradient>

<!-- 流光斜条纹 -->
<linearGradient id="flowGrad" x1="0" y1="0" x2="0.22" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- 龙珠金黄色外发光 -->
<filter id="ballGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd700" flood-opacity="0.85"/>
</filter>

<!-- 流光裁剪（限制在进度条填充范围内） -->
<clipPath id="barClip"><rect x="280" y="136" width="127" height="12"/></clipPath>

</defs>

<!-- 背景 -->
<rect x="1" y="1" width="798" height="248" rx="16" fill="url(#bgGrad)" stroke="rgba(255,215,0,0.16)" stroke-width="1.5"/>

<!-- 四角古风直角边框（左上 / 右下） -->
<path d="M 18 46 L 18 18 L 46 18" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
<path d="M 754 204 L 782 204 L 782 232" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>

<!-- ══ 左侧：龙珠 · 昨日修为 ══ -->

<!-- 旋转虚线外圈（正转） -->
<circle cx="120" cy="115" r="58" fill="none" stroke="rgba(255,215,0,0.28)" stroke-width="1.5" stroke-dasharray="4 9">
  <animateTransform attributeName="transform" type="rotate" from="0 120 115" to="360 120 115" dur="18s" repeatCount="indefinite"/>
</circle>
<!-- 反转虚线外圈 -->
<circle cx="120" cy="115" r="66" fill="none" stroke="rgba(255,215,0,0.15)" stroke-width="1.2" stroke-dasharray="28 16">
  <animateTransform attributeName="transform" type="rotate" from="360 120 115" to="0 120 115" dur="26s" repeatCount="indefinite"/>
</circle>

<!-- 龙珠主体（有提交：金色 + 外发光；无提交：灰白 + 静修） -->
<circle cx="120" cy="115" r="50" fill="url(#ballGrad)" filter="url(#ballGlow)"/>

<!-- 昨日修为数值 -->
<text x="120" y="127" text-anchor="middle" font-size="32" font-weight="700" fill="#1a1a1a">33</text>
     <text x="120" y="146" text-anchor="middle" font-size="10" fill="#5b4308">昨日修为</text>

<!-- 连续道行徽章（streak_days > 0 才显示） -->
<rect x="68" y="186" width="104" height="22" rx="11" fill="rgba(255,215,0,0.12)" stroke="rgba(255,215,0,0.4)" stroke-width="1"/>
     <text x="120" y="200" text-anchor="middle" font-size="11" fill="#ffd700">✦ 连续道行 6 日</text>

<!-- ══ 右侧：灵脉玉简 · 三十日修为 ══ -->

<!-- 顶部标题 + 状态标签 -->
<text x="280" y="48" font-size="16" font-weight="600" fill="#e2e8f0">近三十日道行 · 丙午年 柒月</text>
<rect x="694" y="32" width="82" height="22" rx="11" fill="rgba(0,240,255,0.12)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
<text x="735" y="47" text-anchor="middle" font-size="11" fill="#67e8f9">⚡ 灵脉活跃</text>

<!-- 主数值 + 单位 + 涨幅标签 -->
<text x="280" y="112" font-size="48" font-weight="700" fill="#ffffff">107</text>
<text x="378" y="112" font-size="16" fill="#94a3b8">修为</text>
<rect x="438" y="84" width="64" height="26" rx="13" fill="rgba(16,185,129,0.14)" stroke="#34d399" stroke-opacity="0.5" stroke-width="1"/>
<text x="470" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">+346%</text>

<!-- 灵脉进度条 -->
<rect x="280" y="136" width="470" height="12" rx="6" fill="#1f2a3f"/>
<rect x="280" y="136" width="127" height="12" rx="6" fill="url(#pbarGrad)"/>

<!-- 动态流光（translateX 驱动，clip 限制在填充条内） -->
<g clip-path="url(#barClip)">
  <rect x="280" y="136" width="46" height="12" fill="url(#flowGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0" to="127" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- 终点龙珠（脉动发光） -->
<circle cx="407" cy="142" r="15" fill="rgba(255,215,0,0.2)">
  <animate attributeName="r" values="10;16;10" dur="2.4s" repeatCount="indefinite"/>
</circle>
<circle cx="407" cy="142" r="9" fill="#ffd700">
  <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
</circle>

<!-- 底部状态栏：状态文案（关键词高亮）+ 品质标签 -->
<text x="280" y="180" font-size="13" fill="#94a3b8">灵脉<tspan fill="#ffd700" font-weight="700">初醒</tspan>，涓涓细流...</text>
<rect x="696" y="164" width="82" height="24" rx="12" fill="rgba(255,215,0,0.12)" stroke="rgba(255,215,0,0.4)" stroke-width="1"/>
<text x="737" y="180" text-anchor="middle" font-size="12" fill="#ffd700">品质 · 上品</text>

<!-- ══ 底部：30 日晴雨表 ══ -->
<circle cx="40" cy="222" r="4" fill="#ffd700"/><circle cx="64" cy="222" r="4" fill="#ffd700"/><circle cx="88" cy="222" r="4" fill="#2a3650"/><circle cx="112" cy="222" r="4" fill="#ffd700"/><circle cx="136" cy="222" r="4" fill="#ffd700"/><circle cx="160" cy="222" r="4" fill="#ffd700"/><circle cx="184" cy="222" r="4" fill="#2a3650"/><circle cx="208" cy="222" r="4" fill="#2a3650"/><circle cx="232" cy="222" r="4" fill="#ffd700"/><circle cx="256" cy="222" r="4" fill="#2a3650"/><circle cx="280" cy="222" r="4" fill="#2a3650"/><circle cx="304" cy="222" r="4" fill="#2a3650"/><circle cx="328" cy="222" r="4" fill="#2a3650"/><circle cx="352" cy="222" r="4" fill="#2a3650"/><circle cx="376" cy="222" r="4" fill="#ffd700"/><circle cx="400" cy="222" r="4" fill="#ffd700"/><circle cx="424" cy="222" r="4" fill="#2a3650"/><circle cx="448" cy="222" r="4" fill="#2a3650"/><circle cx="472" cy="222" r="4" fill="#2a3650"/><circle cx="496" cy="222" r="4" fill="#ffd700"/><circle cx="520" cy="222" r="4" fill="#ffd700"/><circle cx="544" cy="222" r="4" fill="#ffd700"/><circle cx="568" cy="222" r="4" fill="#2a3650"/><circle cx="592" cy="222" r="4" fill="#2a3650"/><circle cx="616" cy="222" r="4" fill="#ffd700"/><circle cx="640" cy="222" r="4" fill="#ffd700"/><circle cx="664" cy="222" r="4" fill="#ffd700"/><circle cx="688" cy="222" r="4" fill="#ffd700"/><circle cx="712" cy="222" r="5.5" fill="#ffd700" stroke="#ffffff" stroke-width="1.5"/><circle cx="736" cy="222" r="4" fill="#ffd700"/>
<text x="752" y="226" font-size="10" fill="#94a3b8">昨日</text>

</svg>