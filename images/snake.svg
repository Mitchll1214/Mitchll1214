<svg xmlns="http://www.w3.org/2000/svg"
 width="480"
 height="180"
 viewBox="0 0 480 180"
 role="img"
 font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">


<defs>


<!-- 外框 -->
<linearGradient id="frame"
 x1="0"
 y1="0"
 x2="1"
 y2="1">

<stop offset="0"
 stop-color="#D8B478"/>

<stop offset="0.5"
 stop-color="#8E8CD8"/>

<stop offset="1"
 stop-color="#D96C6C"/>

</linearGradient>



<!-- 灵脉 -->
<linearGradient id="spirit"
 x1="0"
 y1="0"
 x2="1"
 y2="0">

<stop offset="0"
 stop-color="#D8B478"/>

<stop offset="0.45"
 stop-color="#FFF1B8"/>

<stop offset="1"
 stop-color="#8E8CD8"/>

</linearGradient>



<!-- 光晕 -->
<filter id="glow">

<feGaussianBlur
 stdDeviation="4"/>

</filter>



<!-- 游龙路径 -->

<path id="dragon"

d="M42 105
C100 105 125 60 200 60
C280 60 310 125 380 125
C415 125 435 105 450 95"/>


</defs>




<!-- 背景 -->

<rect
x="1"
y="1"
width="478"
height="178"
rx="22"

fill="#0D1117"

stroke="url(#frame)"

stroke-width="2"/>




<!-- 星尘 -->

<g fill="#D8B478">


<circle cx="80" cy="55" r="1.5">
<animate
attributeName="opacity"
values="0.2;1;0.2"
dur="3s"
repeatCount="indefinite"/>
</circle>


<circle cx="260" cy="35" r="1.2">
<animate
attributeName="opacity"
values="1;0.2;1"
dur="2.5s"
repeatCount="indefinite"/>
</circle>


<circle cx="420" cy="55" r="1.5">
<animate
attributeName="opacity"
values="0.2;1;0.2"
dur="4s"
repeatCount="indefinite"/>
</circle>


</g>





<!-- 标题 -->

<text
x="24"
y="32"
font-size="14"
font-weight="700"
fill="#F4E9D8">

☯ 天道灵脉 · 游龙修炼录

</text>



<text
x="456"
y="32"
text-anchor="end"
font-size="10"
fill="#8E8CD8">

GITHUB CULTIVATION

</text>



<line
x1="24"
y1="45"
x2="456"
y2="45"

stroke="#8E8CD8"

stroke-opacity="0.25"/>





<!-- 灵脉外层 -->

<use href="#dragon"

stroke="#D8B478"

stroke-width="14"

opacity="0.2"

fill="none"

filter="url(#glow)"/>




<!-- 灵脉主体 -->

<use href="#dragon"

stroke="url(#spirit)"

stroke-width="5"

fill="none"

stroke-linecap="round"

stroke-dasharray="22 18">


<animate

attributeName="stroke-dashoffset"

from="0"

to="-200"

dur="3s"

repeatCount="indefinite"/>


</use>






<!-- 游动龙珠 -->

<circle r="6"

fill="#FFF1B8">


<animateMotion

dur="5s"

repeatCount="indefinite">

<mpath href="#dragon"/>

</animateMotion>


</circle>





<!-- 龙珠光晕 -->

<circle r="18"

fill="#D8B478"

opacity="0.18"

filter="url(#glow)">


<animateMotion

dur="5s"

repeatCount="indefinite">

<mpath href="#dragon"/>

</animateMotion>


</circle>







<!-- 灵脉节点 -->


<g fill="#FFE6A7">


<circle cx="42"
cy="105"
r="5">

<animate

attributeName="r"

values="5;8;5"

dur="2s"

repeatCount="indefinite"/>

</circle>



<circle cx="200"
cy="60"
r="5">


<animate

attributeName="r"

values="5;7;5"

dur="2.5s"

repeatCount="indefinite"/>

</circle>



<circle cx="380"
cy="125"
r="5">


<animate

attributeName="r"

values="5;8;5"

dur="3s"

repeatCount="indefinite"/>

</circle>


</g>







<!-- 修炼等级 -->

<text

x="24"

y="155"

font-size="11"

fill="#9A93B8">

提交 = 修炼经验 · Commit = 灵气积累

</text>




<text

x="456"

y="155"

text-anchor="end"

font-size="11"

fill="#D8B478">


✦ 灵脉流转中

</text>




</svg>
